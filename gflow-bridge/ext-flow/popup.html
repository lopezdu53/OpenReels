<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; background: #0b0b0c; color: #f5f5f7; }
      label { display: block; color: #8e8e93; font-size: 11px; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px; border: 0; border-radius: 6px; background: #1c1c1e; color: #fff; }
      button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #d8ff00; font-weight: 700; cursor: pointer; }
      #status { margin-top: 10px; color: #8e8e93; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <strong>OpenReels Flow</strong>
    <label>Puente
      <input id="url" value="http://127.0.0.1:8787" />
    </label>
    <label>Token (opcional en este PC)
      <input id="token" type="password" />
    </label>
    <button id="save">Guardar</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
